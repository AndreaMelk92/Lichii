name: Windows relaxed FG pacer

on:
  push:
    branches:
      - pacer-relaxed
    paths:
      - src/**
      - .github/workflows/windows-relaxed-pacer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64 (relaxed pacer)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM on Windows
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore dependency and compiler caches
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/cpm
            .sccache
          key: relaxed-windows-${{ github.sha }}
          restore-keys: |
            relaxed-windows-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DLICHII_BUILD_TAG=relaxed-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64 \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Compile
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel 4

      - name: Bundle Qt
        shell: pwsh
        run: |
          foreach ($exe in 'lichii.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "Missing binary: $exe"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          Copy-Item -Path 'README.md' -Destination 'build/release/bin/UPSTREAM-README.md' -ErrorAction SilentlyContinue

      - name: Include relaxed pacer launcher
        shell: pwsh
        run: |
          @'
          @echo off
          set "LICHII_FG_RELAXED_PACER=1"
          cd /d "%~dp0"
          start "" "%~dp0lichii.exe"
          '@ | Set-Content -Encoding Ascii build/release/bin/Avvia_Lichii_Pacer_Rilassato.bat

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Lichii-Windows-Relaxed-Pacer
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7
